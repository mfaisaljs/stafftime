services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stafftime
    ports:
      - "5432:5432"
    volumes:
      - stafftime_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stafftime"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stafftime_pg:
