# Local dev config. Webhook subscriptions are included when using the ngrok tunnel
# (npm run dev:pos). Plain localhost dev (npm run dev) still cannot receive webhooks.
# Production webhooks also remain in shopify.app.toml for deploy.

client_id = "94ec09cf3eaee34d49da7c9a2e1b91cd"
name = "Trubuild: POS Staff Clock In"
handle = "trubuild-staff-management-39"
application_url = "https://staff-time.onrender.com"
embedded = true

[pos]
embedded = true

[access_scopes]
scopes = "read_locations,read_orders,read_products"

[auth]
redirect_urls = [
  "https://staff-time.onrender.com/auth/callback",
  "https://staff-time.onrender.com/auth/shopify/callback",
  "https://staff-time.onrender.com/api/auth/callback",
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled", "app/scopes_update" ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[build]
automatically_update_urls_on_dev = true
dev_store_url = "spaceraceplayground.myshopify.com"
include_config_on_deploy = false
